<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Jornada Viagens</title>
  </head>
  <body>
    <header class="cabecalho">
      <a href="#" class="cabecalho-logo">
        <img
          class="cabecalho-logo-mobile"
          src="img/logo-bussola-jornada-branco.png"
          alt="icone de bussola do logo jornada viagens"
        />
        <img
          class="cabecalho-logo-desktop"
          src="img/Logo-provisória-branca 1.png"
          alt="Logo jornada viagens"
        />
      </a>
      <div class="cabecalho-menu-hamburguer">
        <label for="menu-hamburguer">
          <img
            class="cabecalho-menu-hamburguer-imagem"
            src="img/menu-hamburguer.png"
            alt="menu hamburguer"
          />
        </label>
        <input type="checkbox" id="menu-hamburguer" hidden />
        <nav class="cabecalho--menu-hamburguer-navegacao">
          <ul class="cabecalho-menu-hamburguer-navegacao-itens">
            <li><a href="#">Blog</a></li>
            <li><a href="#">Pacotes de viagem</a></li>
            <li><a href="#">Contatos</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <section class="hero">
      <div class="hero-img"></div>
      <h2 class="hero-texto">
        Somos uma agência apaixonada por criar viagens inesquecíveis. Do destino
        à seleção das atividades, cuidamos de todos os detalhes para que você
        aproveite ao máximo cada momento da sua jornada!
      </h2>
    </section>
    <section class="ofertas">
      <div class="cabecalho-secao">
        <h1 class="cabecalho-secao-titulo">Ofertas da Semana</h1>
        <hr class="cabecalho-secao-traco" />
      </div>
    </section>
  </body>
</html>
